name: Catalog Audit

# Catalog entries rot: services migrate platforms, make their status page
# private, or shut down. Nothing in PR CI can catch that, because nothing in
# the repo changed. This sweeps every entry weekly and files an issue when
# entries stop working.
#
# Deliberately NOT part of PR CI: these are third-party endpoints, and a red
# build caused by someone else's status page having a bad morning is noise.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit catalog
        id: audit
        run: |
          set +e
          python3 scripts/audit-catalog.py --quiet --json failures.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always()
        run: |
          # Decide from the file, not the exit code: the audit now exits 0 when
          # the only failures are blocked/unreachable ones, which still belong
          # in the summary. A crash writes no file at all.
          if [ ! -s failures.json ]; then
            echo "### Catalog audit did not complete (exit code: ${{ steps.audit.outputs.exit_code }})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if python3 -c "import json,sys; sys.exit(1 if json.load(open('failures.json')) else 0)"; then
            echo "### All catalog entries verified" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Catalog audit found entries it could not verify"
              echo ""
              python3 scripts/report-failures.py failures.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only confident findings — entries that are gone or serving the wrong
      # shape — open an issue. A 403 from a WAF is not a catalog defect, and
      # filing it weekly trained us to ignore the issue.
      - name: Open or update issue
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s failures.json ]; then
            echo "No failure list to report; see the Summarize step."
            exit 0
          fi
          BODY=$(mktemp)
          {
            echo "The weekly catalog audit found entries that no longer return a usable status."
            echo ""
            echo "These ship in the app and appear in the website catalog browser, so a user can"
            echo "add one and it will never report a status."
            echo ""
            python3 scripts/report-failures.py failures.json --ids --confident-only
            echo ""
            echo "Before removing an entry, check whether the service moved: a different domain,"
            echo "or a different platform (Instatus, Better Stack, incident.io, Datadog). Most"
            echo "\"broken\" entries have simply migrated."
            echo ""
            echo "_Run: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > "$BODY"

          EXISTING=$(gh issue list --label catalog-audit --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            gh issue create \
              --title "Catalog audit: broken entries" \
              --label catalog-audit \
              --body-file "$BODY"
          fi
