name: CI

# No untrusted input (issue bodies, PR titles, commit messages) is interpolated
# into any run: step. Context values (event name, base/head SHAs) are passed
# via env: and referenced as shell variables, never interpolated. Safe per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: decide whether anything the macOS build cares about changed.
  # Website/docs-only PRs skip the 15-minute Xcode job. The build job is a
  # required status check, so it must stay in the workflow and be *skipped*
  # via `if:` — a skipped job reports as satisfied, a filtered-out workflow
  # never reports at all and would block the PR forever.
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for app-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request event - building."
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$files"
          # Anything NOT matched here is treated as app code (fail-safe:
          # unknown paths trigger a build rather than silently skipping it).
          app_files=$(printf '%s\n' "$files" | grep -vE '^(website/|workers/|docs/|\.github/workflows/visual\.yml$|package(-lock)?\.json$|playwright\.config\.js$|[^/]*\.md$|LICENSE$)' || true)
          if [ -n "$app_files" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Only website/docs files changed - skipping the Xcode build."
          fi

  # Not gated on `changes`: the count can drift from either side (catalog
  # edits or copy edits), and the check takes seconds.
  service-count:
    name: Service count copy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check stated service counts against the catalog
        run: python3 scripts/check-service-count.py

  build-and-test:
    name: Build + Test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show project targets
        run: xcodebuild -project StatusMonitor.xcodeproj -list

      - name: Build (Debug, DMG flavor)
        run: |
          set -o pipefail
          xcodebuild \
            -project StatusMonitor.xcodeproj \
            -scheme StatusMonitor \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The App Store flavor shares every source file but links no Sparkle.
      # Building it here is what catches a Sparkle reference that escaped its
      # `#if !MAS` guard, or a new file added to only one target.
      - name: Build (Release, App Store flavor)
        run: |
          set -o pipefail
          xcodebuild \
            -project StatusMonitor.xcodeproj \
            -scheme Nazar-MAS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Assert flavor split
        run: |
          set -euo pipefail
          dmg_app=build/ci/Build/Products/Debug/Nazar.app
          mas_app=build/ci/Build/Products/Release/Nazar-MAS.app

          fail() { echo "::error::$1"; exit 1; }

          [ -d "$dmg_app" ] || fail "DMG app not found at $dmg_app"
          [ -d "$mas_app" ] || fail "App Store app not found at $mas_app"

          # A Debug build's executable is a shim that links Nazar.debug.dylib;
          # the app's own dependencies live in that dylib, so both have to be
          # inspected. Capture the output first — piping it straight into
          # `grep -q` makes grep close the pipe on its first match, which
          # kills otool with SIGPIPE and, under `pipefail`, fails the pipeline.
          links_for() {
            local app=$1 exe=$2
            local binaries=("$app/Contents/MacOS/$exe")
            while IFS= read -r dylib; do
              binaries+=("$dylib")
            done < <(find "$app" -name '*.debug.dylib')
            otool -L "${binaries[@]}"
          }

          dmg_links=$(links_for "$dmg_app" Nazar)
          mas_links=$(links_for "$mas_app" Nazar-MAS)
          echo "DMG links:"; echo "$dmg_links"
          echo "App Store links:"; echo "$mas_links"

          # DMG flavor: Sparkle embedded, linked, and configured.
          [ -d "$dmg_app/Contents/Frameworks/Sparkle.framework" ] \
            || fail "DMG build is missing Sparkle.framework"
          case "$dmg_links" in
            *Sparkle*) ;;
            *) fail "DMG executable does not link Sparkle" ;;
          esac
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$dmg_app/Contents/Info.plist" >/dev/null \
            || fail "DMG Info.plist is missing SUFeedURL"

          # App Store flavor: none of the above.
          [ ! -e "$mas_app/Contents/Frameworks/Sparkle.framework" ] \
            || fail "App Store build contains Sparkle.framework"
          case "$mas_links" in
            *Sparkle*) fail "App Store executable links Sparkle" ;;
          esac
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$mas_app/Contents/Info.plist" >/dev/null 2>&1; then
            fail "App Store Info.plist carries SUFeedURL"
          fi

          echo "Both flavors are correct."

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project StatusMonitor.xcodeproj \
            -scheme StatusMonitor \
            -destination 'platform=macOS' \
            -only-testing:StatusMonitorTests \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO \
            test

      # UI tests need a GUI session. macOS runners have one but XCUITest
      # can be flakier than unit tests on shared infra — kept separate so
      # a UI flake doesn't mask a unit regression.
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project StatusMonitor.xcodeproj \
            -scheme StatusMonitor \
            -destination 'platform=macOS' \
            -only-testing:StatusMonitorUITests \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO \
            test
        continue-on-error: true
